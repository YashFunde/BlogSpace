
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog | BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h2 class="logo">BlogSpace</h2>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="login.html">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main class="create-blog-container">

        <div class="create-blog-card">

            <a href="dashboard.html" class="back-home">← Back to Dashboard</a>

            <h1>Create New Blog</h1>
            <p class="auth-description">
                Share your thoughts and ideas with the world.
            </p>

            <form id="blogForm">

                <div class="form-group">
                    <label for="blogTitle">Blog Title</label>
                    <input
                        type="text"
                        id="blogTitle"
                        placeholder="Enter your blog title"
                        required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select a category</option>
                        <option value="Technology">Technology</option>
                        <option value="Programming">Programming</option>
                        <option value="Education">Education</option>
                        <option value="Lifestyle">Lifestyle</option>
                        <option value="Career">Career</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="blogImage">Featured Image URL</label>
                    <input
                        type="url"
                        id="blogImage"
                        placeholder="Enter image URL (optional)">
                </div>

                <div class="form-group">
                    <label for="blogContent">Blog Content</label>
                    <textarea
                        id="blogContent"
                        rows="8"
                        placeholder="Write your blog content here..."
                        required></textarea>
                </div>

                <button type="submit" class="auth-btn">
                    Publish Blog
                </button>

            </form>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 BlogSpace. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
