
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details | BlogSpace</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .blog-details-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .details-image {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 12px;
            margin: 20px 0;
        }

        .details-category {
            display: inline-block;
            color: #4f46e5;
            background: #eef2ff;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .details-title {
            font-size: 36px;
            margin-bottom: 15px;
            color: #222;
        }

        .details-author {
            color: #777;
            margin-bottom: 20px;
        }

        .details-content {
            font-size: 17px;
            line-height: 1.8;
            color: #444;
            white-space: pre-wrap;
        }

        .details-message {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
        }

        @media (max-width: 600px) {
            .details-title {
                font-size: 27px;
            }

            .blog-details-container {
                margin: 25px auto;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <h2 class="logo">BlogSpace</h2>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#blogs">Explore</a></li>
                <li><a href="login.html" id="loginLink">Login</a></li>
                <li>
                    <a href="register.html" class="btn" id="registerLink">
                        Get Started
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Blog Details -->
    <main class="blog-details-container">

        <a href="index.html" class="back-link">
            ← Back to Blogs
        </a>

        <div id="blogDetails" class="details-message">
            Loading blog...
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 BlogSpace. All Rights Reserved.</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
