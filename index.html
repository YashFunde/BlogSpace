
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogSpace | Home</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <nav class="navbar">
            <h2 class="logo">BlogSpace</h2>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="#blogs">Explore</a></li>
                <li><a href="login.html" id="loginLink">Login</a></li>
                <li><a href="register.html" class="btn" id="registerLink">Get Started</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Ideas Worth Sharing.</h1>
        <p>Discover stories, insights, and ideas from creative minds.</p>
        <a href="#blogs" class="hero-btn">Explore Blogs</a>
    </section>

    <!-- Blog Section -->
    <section class="blogs" id="blogs">
        <h2>Latest Blogs</h2>
        <p class="section-description">
            Explore the latest stories from our community.
        </p>

        <!-- Search and Category Filter -->
        <div class="blog-filters">
            <input
                type="text"
                id="searchInput"
                placeholder="Search blogs by title or content..."
            >

            <select id="categoryFilter">
                <option value="">All Categories</option>
            </select>
        </div>

        <!-- Blogs will be loaded from backend -->
        <div class="blog-container">
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 BlogSpace. All Rights Reserved.</p>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
